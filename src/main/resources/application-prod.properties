# Database 설정
spring.datasource.url=jdbc:mariadb://mariadb:3306/recruit
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=email,profile

# Kakao OAuth2
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
#spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=account_email,profile_nickname

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# JWT 비밀키
jwt.secret=${JWT_SECRET}

# 이메일 전송용 SMTP 설정 (Gmail) (587 + STARTTLS)
mail.gmail.host=smtp.gmail.com
mail.gmail.port=587
mail.gmail.username=${MAIL_USERNAME}
mail.gmail.password=${MAIL_PASSWORD}
mail.gmail.properties.mail.smtp.auth=true
mail.gmail.properties.mail.smtp.starttls.enable=true
mail.gmail.properties.mail.smtp.starttls.required=true
mail.gmail.default-encoding=UTF-8

# 이메일 전송용 SMTP 설정 (Naver) (465 + SSL)
mail.naver.host=smtp.naver.com
mail.naver.port=465
mail.naver.username=${NAVER_MAIL_USERNAME}
mail.naver.password=${NAVER_MAIL_PASSWORD}
mail.naver.properties.mail.smtp.auth=true
mail.naver.properties.mail.smtp.ssl.enable=true
mail.naver.properties.mail.smtp.ssl.trust=smtp.naver.com
mail.naver.default-encoding=UTF-8

#redis 설정
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.timeout=3000

#프론트 엔드 서버
app.frontend.url=${FRONTEND_URL}

# 표정 분석 url
emotion.server.url=${EMOTION_SERVER_URL}
# STT 서버 url
stt.server.url=${STT_SERVER_URL}
# 첫 번째 질문 서버 url
first-ask.api.url=${FIRST_ASK_SERVER_URL}/first-ask
# OCR 서버 url
ocr.api.file-url=${FIRST_ASK_SERVER_URL}/upload
# 트래킹 분석 url
tracking.server.url=${TRACKING_SERVER_URL}
# vllm 분석 url
evaluate.server.url=${EVALUATE_SERVER_URL}
#영상 저장
app.media.storage=s3
aws.s3.bucket=${S3_BUCKET}
aws.s3.region=${AWS_REGION:ap-northeast-2}
aws.s3.prefix.tmp=tmp
aws.s3.prefix.media=media
app.temp-media.ttl-seconds=1800

# CloudFront/ALB 프록시 헤더 신뢰
server.forward-headers-strategy=native
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoints.web.base-path=/actuator
