<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>관리자 로그인</title>
    <style>
        :root {
            --primary-color: #335C91;
            --secondary-color: #50E3C2;
            --background-color: #F8F9FA;
            --card-bg-color: #FFFFFF;
            --text-color: #343A40;
            --border-color: #DEE2E6;
            --shadow-light: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: var(--background-color);
            color: var(--text-color);
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background-color: var(--card-bg-color);
            border-radius: 12px;
            box-shadow: 0 10px 30px var(--shadow-light);
            transition: transform 0.3s ease;
            text-align: center;
        }

        .login-container:hover {
            transform: translateY(-5px);
        }

        h1 {
            margin-bottom: 25px;
            font-size: 28px;
            font-weight: bold;
            color: var(--primary-color);
        }

        form {
            display: flex;
            flex-direction: column;
        }

        form div {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-color);
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
            outline: none;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #357ABD;
        }
    </style>
</head>
<body>
<div class="login-container">
    <h1>
        <i class="fa-solid fa-user-tie"></i> 관리자 로그인
    </h1>
    <form id="loginForm">
        <div>
            <label for="email"><i class="fa-solid fa-envelope"></i> 이메일</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div>
            <label for="password"><i class="fa-solid fa-lock"></i> 비밀번호</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">로그인</button>
    </form>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function(event) {
        event.preventDefault(); // 폼 제출 기본 동작 방지

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password })
            });

            if (response.ok) {
                alert('로그인 성공!');
                window.location.href = '/admin/dashboard';
            } else {
                // ✅ 이 부분을 수정해야 합니다.
                const errorData = await response.json();

                if (response.status === 403 && errorData.code === "AUTH007") {
                    alert('로그인 실패: ' + errorData.message);
                } else {
                    alert('로그인 실패: ' + (errorData.message || '알 수 없는 오류'));
                }
            }
        } catch (error) {
            console.error('로그인 중 오류:', error);
            alert('로그인 중 오류가 발생했습니다.');
        }
    });
</script>
</body>
</html>
